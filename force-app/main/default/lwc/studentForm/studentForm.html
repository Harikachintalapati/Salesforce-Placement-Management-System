<template>
    <lightning-card title="Student Form">
        <div class="slds-p-around_medium">

            <lightning-input label="Name" value={name} onchange={handleName} required></lightning-input>

            <lightning-input label="Email" type="email" value={email} onchange={handleEmail} required></lightning-input>

            <lightning-input label="Course" value={course} onchange={handleCourse} required></lightning-input>

            <lightning-button 
                label="Save" 
                variant="brand" 
                onclick={handleSave}
                disabled={isSaving}>
            </lightning-button>

        </div>
    </lightning-card>
</template>
